  .c-cal__grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
  .c-cal__dow { text-align: center; font-family: var(--f-mono); font-size: .64rem; letter-spacing: .08em; color: var(--c-dim); padding-bottom: 4px; }
  .c-cal__day { aspect-ratio: 1; min-height: 34px; border-radius: 9px; font-weight: 600; font-size: .92rem; background: var(--neo-panel); box-shadow: var(--neo-raise-sm); border: 1px solid var(--neo-border); font-variant-numeric: tabular-nums; }

  .c-cal__legend { margin-top: 10px; font-size: .78rem; color: var(--c-dim); }

  .c-veh { display: grid; gap: 18px; }

  .c-review { display: grid; gap: 0; border-radius: var(--r-neo-field); box-shadow: var(--neo-inset); border: 1px solid var(--neo-border); padding: 6px 16px; }

  .c-send { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 24px; background: var(--c-overlay); opacity: 0; transition: opacity .25s; }

  .c-send__card { display: grid; justify-items: center; gap: 12px; padding: 26px 30px 24px; background: var(--c-steel); border: 1px solid var(--c-line-2); border-top: 3px solid var(--c-accent); border-radius: var(--r-2); box-shadow: var(--sh-card); text-align: center; max-width: 320px; width: 100%; }
  .c-send__gauge { width: 210px; height: auto; max-width: 100%; }
  .c-send__needle { transform-origin: 105px 105px; transform: rotate(-120deg); }
  .c-send.is-play .c-send__needle { animation: c-send-sweep 1.15s var(--ease) forwards; }

  @keyframes c-send-sweep { 0% { transform: rotate(-120deg); } 62% { transform: rotate(112deg); } 78% { transform: rotate(74deg); } 90% { transform: rotate(88deg); } 100% { transform: rotate(80deg); } }

  @keyframes c-send-fade { to { opacity: 1; } }

  .c-jump { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 50; display: flex; gap: 10px; opacity: 0; transform: translateY(12px); pointer-events: none; transition: opacity var(--dur-2), transform var(--dur-2); }

  .c-jump__top { width: 48px; height: 48px; display: grid; place-items: center; background: var(--c-steel-2); border: 1px solid var(--c-line-2); border-radius: var(--r-1); box-shadow: var(--sh-card); }

}

@layer sections {
  .s-topbar { position: fixed; inset: 0 0 auto; z-index: 40; height: var(--topbar-h); display: flex; align-items: center; transition: background var(--dur-2), box-shadow var(--dur-2); }

  .s-hero__item { display: flex; align-items: center; gap: 1.5rem; padding: .95rem 1.5rem; white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; letter-spacing: .15em; text-transform: uppercase; color: var(--c-muted); }

        const budget = SITE.limits.vehicleLookupMs;
        try {
          const r = await withTimeout('https://vpic.nhtsa.dot.gov/api/vehicles/GetModelsForMakeYear/make/' + encodeURIComponent(make) + '/modelyear/' + year + '?format=json', Math.round(budget * 0.6));
          const j = await r.json();
          const names = Array.from(new Set((j.Results || []).map((x) => x.Model_Name).filter(Boolean))).sort();
          if (names.length) return names;
        } catch (e) { }
        const left = budget - (Date.now() - start);
        if (left < 500) return [];
        try {
          const r = await withTimeout('https://www.fueleconomy.gov/ws/rest/vehicle/menu/model?year=' + year + '&make=' + encodeURIComponent(make), left, { headers: { Accept: 'application/json' } });
          const j = await r.json();
          let items = j && j.menuItem ? j.menuItem : [];
          if (!Array.isArray(items)) items = [items];
          return Array.from(new Set(items.map((x) => x.text).filter(Boolean))).sort();
        } catch (e) { return []; }
      }
      function setModelTyped(on, msg) {
        S.veh.typeModel = on;
        mdTyped.hidden = !on;
        modelWrap.hidden = on;
        vehStatus.textContent = msg || '';
        if (on) { S.veh.model = ''; }
      }
      function fillModels(list) {
        mdSel.innerHTML = '<option value="">Select model</option>' + list.map((m) => '<option>' + esc(m) + '</option>').join('') + '<option value="__type">Not listed, I\u2019ll type it</option>';
        mdSel.disabled = false;
        setModelTyped(false, '');
      }
      async function loadModels() {
        const year = S.veh.year, make = S.veh.make;
        S.veh.model = '';
        mdSel.innerHTML = '<option value="">Pick year and make first</option>';
        mdSel.disabled = true;
        setModelTyped(false, '');
        if (!year || !make) return;
        if (make === '__type' || year === 'older') { setModelTyped(true, 'Type the model below.'); return; }
        const y = Number(year);
        const key = y + '|' + make;
        if (cache.has(key)) { const c = cache.get(key); if (c.length) fillModels(c); else setModelTyped(true, 'Type the model below.'); return; }
        const local = y >= SITE.limits.carDataFrom ? builtInModels(y, make) : [];
        if (local.length) { cache.set(key, local); fillModels(local); return; }
        const id = ++lookupId;
        mdSel.innerHTML = '<option value="">Loading models\u2026</option>';
        vehStatus.textContent = 'Looking up models\u2026';
        const remote = await remoteModels(y, make);
        if (id !== lookupId) return;
        cache.set(key, remote);
        if (remote.length) fillModels(remote);
        else setModelTyped(true, 'Type the model below.');
      }
      ySel.addEventListener('change', () => { S.veh.year = ySel.value; loadModels(); });
      mkSel.addEventListener('change', () => {
        S.veh.make = mkSel.value;
        S.veh.typeMake = mkSel.value === '__type';
        mkTyped.hidden = !S.veh.typeMake;
        if (S.veh.typeMake) mkTyped.focus();
        loadModels();
      });
      mdSel.addEventListener('change', () => {
        if (mdSel.value === '__type') { setModelTyped(true, ''); mdTyped.focus(); return; }
        S.veh.model = mdSel.value;
      });
      mkTyped.addEventListener('input', () => { S.veh.makeTyped = mkTyped.value; });
      mdTyped.addEventListener('input', () => { S.veh.modelTyped = mdTyped.value; });

      const calBtn = R('calBtn'), cal = R('cal'), partsWrap = R('parts'), partRow = R('partRow'), timesWrap = R('times'), timeRow = R('timeRow');
      const whenErr = $('#rq-err-when', fG);
      const flexBtn = $('[data-when="flex"]', fG);
      function dateOk(y, m, d) {
        const n = shopNow();
        if (dayNum(y, m, d) < dayNum(n.y, n.m, n.d)) return false;
        return slotsForDate(y, m, d).length > 0;
      }
      function renderCal() {
        const n = shopNow();
        const vy = S.when.viewY, vm = S.when.viewM;
        const first = dowOf(vy, vm, 1);
        const dim = new Date(Date.UTC(vy, vm, 0)).getUTCDate();
        const monthsFromNow = (vy - n.y) * 12 + (vm - n.m);
        let cells = DAYS.map((d) => '<span class="c-cal__dow" aria-hidden="true">' + d[2].slice(0, 2) + '</span>').join('');
        for (let i = 0; i < first; i++) cells += '<span aria-hidden="true"></span>';
        for (let d = 1; d <= dim; d++) {
          const ok = dateOk(vy, vm, d);
          const sel = S.when.date && S.when.date.y === vy && S.when.date.m === vm && S.when.date.d === d;
          const today = n.y === vy && n.m === vm && n.d === d;
          cells += '<button type="button" class="c-cal__day' + (today ? ' is-today' : '') + '" data-day="' + d + '"' + (ok ? '' : ' disabled') + ' aria-pressed="' + (sel ? 'true' : 'false') + '" aria-label="' + DAYS[dowOf(vy, vm, d)][1] + ', ' + MONTHS_LONG[vm - 1] + ' ' + d + (ok ? '' : ', not available') + '">' + d + '</button>';
        }
        cal.innerHTML =
          '<div class="c-cal__head">' +
          '<button type="button" class="c-cal__nav" data-cal="-1" aria-label="Previous month"' + (monthsFromNow <= 0 ? ' disabled' : '') + '>' + ICON.left + '</button>' +
          '<p class="c-cal__title" aria-live="polite">' + MONTHS_LONG[vm - 1] + ' ' + vy + '</p>' +
          '<button type="button" class="c-cal__nav" data-cal="1" aria-label="Next month"' + (monthsFromNow >= SITE.limits.calendarMonthsAhead ? ' disabled' : '') + '>' + ICON.right + '</button>' +
          '</div>' +
          '<div class="c-cal__grid">' + cells + '</div>' +
          '<p class="c-cal__legend">Days the shop has posted hours can be picked.</p>';
      }
      cal.addEventListener('click', (e) => {
        const nav = e.target.closest('[data-cal]');
        if (nav && !nav.disabled) {
          let m = S.when.viewM + Number(nav.dataset.cal), y = S.when.viewY;
          if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; }
          S.when.viewM = m; S.when.viewY = y; renderCal();
          const again = $('[data-cal="' + nav.dataset.cal + '"]', cal); if (again && !again.disabled) again.focus();
          return;
        }
        const day = e.target.closest('[data-day]');
        if (day && !day.disabled) {
          S.when.date = { y: S.when.viewY, m: S.when.viewM, d: Number(day.dataset.day) };
          S.when.part = null; S.when.time = null;
          closeCal();
          setErr(whenErr, false);
          renderWhen();
          const firstPart = $('button', partRow); if (firstPart) firstPart.focus();
        }
      });
      cal.addEventListener('keydown', (e) => { if (e.key === 'Escape') { e.preventDefault(); closeCal(); calBtn.focus(); } });
      function openCal() {
        S.when.mode = 'cal'; S.when.calOpen = true;
        if (S.when.date) { S.when.viewY = S.when.date.y; S.when.viewM = S.when.date.m; }
        renderCal(); renderWhen();
        const target = $('.c-cal__day[aria-pressed="true"]', cal) || $('.c-cal__day:not(:disabled)', cal) || $('[data-cal="1"]', cal);
        if (target) target.focus();
      }
      function closeCal() { S.when.calOpen = false; renderWhen(); }
      function renderWhen() {
        const w = S.when;
        flexBtn.setAttribute('aria-pressed', String(w.mode === 'flex'));
        calBtn.setAttribute('aria-pressed', String(w.mode === 'cal'));
        calBtn.setAttribute('aria-expanded', String(w.calOpen));
        calBtn.innerHTML = w.date ? ICON.cal.replace('<svg', '<svg style="width:1em;height:1em;display:inline-block;vertical-align:-.12em;margin-right:.4em"') + esc(fmtDate(w.date)) : 'Pick a date';
        cal.hidden = !w.calOpen;
        if (w.mode !== 'cal' || !w.date || w.calOpen) { partsWrap.hidden = true; timesWrap.hidden = true; return; }
        const slots = slotsForDate(w.date.y, w.date.m, w.date.d);
        const parts = PARTS.filter((p) => slots.some((t) => t >= p.from && t < p.to));
        partRow.innerHTML = parts.map((p) => '<button type="button" class="c-neo-chip" data-part="' + p.id + '" aria-pressed="' + (w.part === p.id) + '">' + p.label + '</button>').join('');
        partsWrap.hidden = false;
        if (!w.part) { timesWrap.hidden = true; return; }
        const part = PARTS.find((p) => p.id === w.part);
        const ts = slots.filter((t) => t >= part.from && t < part.to);
        timeRow.innerHTML = ts.map((t) => '<button type="button" class="c-neo-chip" data-time="' + t + '" aria-pressed="' + (w.time === t) + '">' + fmtTime(t) + '</button>').join('');
        timesWrap.hidden = ts.length === 0;
      }
      flexBtn.addEventListener('click', () => {
        S.when = Object.assign(S.when, { mode: 'flex', date: null, part: null, time: null, calOpen: false });
        setErr(whenErr, false); renderWhen();
      });
      calBtn.addEventListener('click', () => { if (S.when.calOpen) { closeCal(); } else { setErr(whenErr, false); openCal(); } });
      partRow.addEventListener('click', (e) => {
        const b = e.target.closest('[data-part]'); if (!b) return;
        S.when.part = b.dataset.part; S.when.time = null; renderWhen();
        const fb = $('[data-part="' + S.when.part + '"]', partRow); if (fb) fb.focus();
      });
      timeRow.addEventListener('click', (e) => {
        const b = e.target.closest('[data-time]'); if (!b) return;
        const t = Number(b.dataset.time);
        S.when.time = S.when.time === t ? null : t; renderWhen();
        const fb = $('[data-time="' + t + '"]', timeRow); if (fb) fb.focus();
      });
      const whenText = () => {
        const w = S.when;
        if (w.mode !== 'cal' || !w.date) return 'Flexible';
        let s = fmtDate(w.date);
        if (w.part) s += ', ' + PARTS.find((p) => p.id === w.part).label;
        if (w.part && w.time !== null) s += ', ' + fmtTime(w.time);
        return s;
      };

      const cName = $('#rq-c-name', fG), cPhone = $('#rq-c-phone', fG), cNote = $('#rq-c-note', fG), cErr = $('#rq-err-contact', fG);
      const contactOk = () => S.contact.name.trim() && S.contact.phone.length >= 7;
      bindPhone(cPhone, (d) => { S.contact.phone = d; syncNext(); if (contactOk()) setErr(cErr, false, [cName, cPhone]); else if (d.length >= 7) cPhone.removeAttribute('aria-invalid'); });
      cName.addEventListener('input', () => { S.contact.name = cName.value; if (contactOk()) setErr(cErr, false, [cName, cPhone]); else if (cName.value.trim()) cName.removeAttribute('aria-invalid'); });
      cNote.addEventListener('input', () => { S.contact.note = cNote.value; });

      const vehicleText = () => {
        const v = S.veh;
        const make = v.typeMake ? v.makeTyped.trim() : (v.make && v.make !== '__type' ? v.make : '');
        const model = v.typeModel ? v.modelTyped.trim() : v.model;
        const year = v.year === 'older' ? 'Older than ' + SITE.limits.yearFloor : v.year;
        return [year, make, model].filter(Boolean).join(' ');
      };
      const serviceText = () => SITE.services.filter((s) => S.picks.has(s.id)).map((s) => s.name).join(', ');

      function renderReview() {
        const rows = [
          ['Service', serviceText(), 0],
          ['Vehicle', vehicleText() || 'Not given', 1],
          ['When', whenText(), 2],
          ['Name', S.contact.name.trim(), 3],
          ['Phone', fmtPhone(S.contact.phone), 3]
        ];
        if (S.contact.note.trim()) rows.push(['Note', S.contact.note.trim(), 3]);
        R('review').innerHTML = rows.filter((r) => r[1]).map((r) =>
          '<div class="c-review__row"><span class="c-review__k">' + r[0] + '</span><span class="c-review__v">' + esc(r[1]) + '</span>' +
          '<button type="button" class="c-review__edit" data-goto="' + r[2] + '" aria-label="Edit ' + r[0].toLowerCase() + '">Edit</button></div>').join('');
      }
      R('review').addEventListener('click', (e) => { const b = e.target.closest('[data-goto]'); if (b) { S.step = Number(b.dataset.goto); renderStep(true); } });

      function syncNext() {
        const name = steps[S.step];
        btnNext.disabled = name === 'contact' && S.contact.phone.length < 7;
        if (name === 'contact') btnNext.setAttribute('aria-describedby', 'rq-c-phone-hint'); else btnNext.removeAttribute('aria-describedby');
      }
      function renderStep(focus) {
        const name = steps[S.step];
        $$('[data-step]', fG).forEach((s) => { s.hidden = s.dataset.step !== name; });
        R('stepnum').textContent = 'Step ' + (S.step + 1) + ' of ' + steps.length;
        R('stepname').textContent = STEP_NAMES[name];
        R('bar').style.width = ((S.step + 1) / steps.length * 100) + '%';
        btnBack.hidden = S.step === 0;
        btnNext.innerHTML = name === 'review' ? 'Write it up' : 'Next' + ICON.right;
        if (name === 'when') renderWhen();
        if (name === 'review') renderReview();
        syncNext();
        if (focus) { const h = $('[data-step="' + name + '"] .c-rq-q', fG); if (h) h.focus({ preventScroll: true }); fG.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'nearest' }); }
      }
      function validate() {
        const name = steps[S.step];
        if (name === 'service' && !S.picks.size) { setErr($('#rq-err-service', fG), true); return false; }
        if (name === 'when' && S.when.mode === 'cal' && !S.when.date) { setErr(whenErr, true); return false; }
        if (name === 'contact' && !contactOk()) {
          const bad = [];
          if (!S.contact.name.trim()) bad.push(cName);
          if (S.contact.phone.length < 7) bad.push(cPhone);
          setErr(cErr, true, bad);
          (bad[0] || cName).focus();
          return false;
        }
        return true;
      }
      btnNext.addEventListener('click', () => {
        if (!validate()) return;
        if (steps[S.step] === 'review') { finish('guided'); return; }
        S.step = Math.min(steps.length - 1, S.step + 1);
        renderStep(true);
      });
      btnBack.addEventListener('click', () => { S.step = Math.max(0, S.step - 1); renderStep(true); });
      fG.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' || e.target.tagName !== 'INPUT') return;
        e.preventDefault();
        if (!btnNext.disabled) btnNext.click();
      });

      function summaryText(path) {
        const lines = ['Hi ' + SITE.name + ',', ''];
        if (path === 'quick') {
          lines.push('Request: please call me back');
          lines.push('Name: ' + S.quick.name.trim());
          lines.push('Phone: ' + fmtPhone(S.quick.phone));
          if (S.quick.note.trim()) lines.push('Note: ' + S.quick.note.trim());
        } else {
          lines.push('Service: ' + serviceText());
          lines.push('Vehicle: ' + (vehicleText() || 'Not given'));
          lines.push('When: ' + whenText());
          lines.push('Name: ' + S.contact.name.trim());
          lines.push('Phone: ' + fmtPhone(S.contact.phone));
          if (S.contact.note.trim()) lines.push('Note: ' + S.contact.note.trim());
        }
        return lines.join('\n');
      }
      function finish(path) {
        S.lastPath = path;
        const text = summaryText(path);
        R('summary').textContent = text;
        R('sms').setAttribute('href', 'sms:' + SITE.phoneE164 + '?&body=' + encodeURIComponent(text));
        R('copyMsg').textContent = '';
        playSend(() => {
          tabs.hidden = true; fQ.hidden = true; fG.hidden = true;
          result.hidden = false;
          panel.scrollIntoView({ behavior: 'auto', block: 'nearest' });
          R('resultHead').focus({ preventScroll: true });
        });
      }
      $('[data-act="edit"]', result).addEventListener('click', () => {
        result.hidden = true; tabs.hidden = false;
        setPath(S.lastPath);
        if (S.lastPath === 'guided') { S.step = steps.length - 1; renderStep(true); } else qName.focus();
      });
      $('[data-act="copy"]', result).addEventListener('click', async () => {
        const text = R('summary').textContent;
        const msg = R('copyMsg');
        try {
          if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); msg.textContent = 'Copied. Paste it into a text or email to the shop.'; return; }
          throw new Error('no clipboard');
        } catch (err) {
          const ta = document.createElement('textarea');
          ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0'; ta.style.left = '0'; ta.style.top = '0';
          document.body.insertBefore(ta, document.body.firstChild);
          ta.select();
          let ok = false;
          try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
          ta.remove();
          msg.textContent = ok ? 'Copied. Paste it into a text or email to the shop.' : 'Copy did not work here. Select the text above and copy it.';
        }
      });

      picksChanged();
      renderStep(false);
    },

    footer(el) {
      $('[data-slot="footer"]', el).innerHTML =
        '<div><p class="s-footer__name">' + esc(SITE.name) + '</p>' +
        '<p class="s-footer__meta">' + esc(SITE.address.city + ', ' + SITE.address.region) + ' \u00b7 <a href="' + telHref() + '">' + esc(SITE.phone) + '</a></p></div>' +
        '<nav class="s-footer__links" aria-label="Footer">' + SITE.footerLinks.map((l) => '<a href="' + l[1] + '">' + esc(l[0]) + '</a>').join('') + '</nav>';
    },

    studio(el) {
      el.innerHTML = '<a href="' + esc(SITE.studioLink) + '" target="_blank" rel="noopener">Message me about this site</a>';
    },

    jump(el) {
      el.innerHTML =
        '<a class="c-btn c-btn--accent c-jump__req" href="#request" data-ref="req">Request</a>' +
        '<button type="button" class="c-jump__top" aria-label="Back to top">' + ICON.up + '</button>';
      const req = $('[data-ref="req"]', el);
      $('.c-jump__top', el).addEventListener('click', () => window.scrollTo({ top: 0, behavior: reduceMotion() ? 'auto' : 'smooth' }));
      const hero = document.getElementById('hero');
      const panel = $('#request .s-request__panel');
      const reqSec = document.getElementById('request');
      let pastHero = false, formOn = false, panelOn = false;
      const apply = () => {
        el.classList.toggle('is-on', pastHero && !panelOn);
        req.hidden = formOn;
      };
      if ('IntersectionObserver' in window) {
        new IntersectionObserver((en) => { pastHero = !en[0].isIntersecting; apply(); }, { threshold: 0.15 }).observe(hero);
        if (reqSec) new IntersectionObserver((en) => { formOn = en[0].isIntersecting; apply(); }, { threshold: 0 }).observe(reqSec);
        if (panel) new IntersectionObserver((en) => { panelOn = en[0].isIntersecting; apply(); }, { rootMargin: '0px 0px -0px 0px', threshold: 0 }).observe(panel);
      } else {
        const onScroll = () => { pastHero = window.scrollY > window.innerHeight * 0.6; apply(); };
        window.addEventListener('scroll', onScroll, { passive: true }); onScroll();
      }
    }
  };

  function buildSchema() {
    const dayNames = { mon: 'Monday', tue: 'Tuesday', wed: 'Wednesday', thu: 'Thursday', fri: 'Friday', sat: 'Saturday', sun: 'Sunday' };
    const spec = Object.keys(SITE.hours).filter((k) => SITE.hours[k]).map((k) => ({ '@type': 'OpeningHoursSpecification', dayOfWeek: 'https://schema.org/' + dayNames[k], opens: SITE.hours[k][0], closes: SITE.hours[k][1] }));
    const data = {
      '@context': 'https://schema.org',
      '@type': 'AutoRepair',
      name: SITE.name,
      telephone: SITE.phoneE164,
      address: { '@type': 'PostalAddress', streetAddress: SITE.address.street, addressLocality: SITE.address.city, addressRegion: SITE.address.region, postalCode: SITE.address.zip, addressCountry: SITE.address.country },
      openingHoursSpecification: spec,
      sameAs: [SITE.facebook],
      makesOffer: SITE.services.map((s) => ({ '@type': 'Offer', itemOffered: { '@type': 'Service', name: s.name } }))
    };
    if (SITE.rating.printable && SITE.rating.count >= 10) data.aggregateRating = { '@type': 'AggregateRating', ratingValue: SITE.rating.value, reviewCount: SITE.rating.count, bestRating: 5 };
    const s = document.createElement('script');
    s.type = 'application/ld+json';
    s.textContent = JSON.stringify(data);
    document.head.appendChild(s);
  }

  try { buildSchema(); } catch (e) { if (window.console) console.warn('schema', e); }
  $$('[data-module]').forEach((el) => {
    const fn = MODULES[el.dataset.module];
    if (!fn) return;
    try { fn(el); } catch (e) { if (window.console) console.warn('module ' + el.dataset.module, e); }
  });
})();
</script>
