<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="case-tag" content="">
<title>Bucher's Lawn Care | Lawn Care in East Hanover Twp, PA</title>
<meta name="description" content="Bucher's Lawn Care, lawn care and landscaping in East Hanover Twp, PA. Call (717) 514-2630 for a free estimate.">
<meta name="theme-color" content="#0d5f13">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@layer reset, tokens, base, layout, components, sections, utilities;

@layer reset {
  *, *::before, *::after { box-sizing: border-box; }
  * { margin: 0; }
  html, body { overflow-x: clip; }
  img, video, svg { display: block; max-width: 100%; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }
  a { color: inherit; }
  ul, ol { padding: 0; list-style: none; }
  fieldset { border: 0; padding: 0; min-width: 0; }
  legend { padding: 0; }
  table { border-collapse: collapse; }
}

@layer tokens {
  :root {
 
    --c-pine: #0d5f13;
    --c-pine-deep: #08420c;
    --c-pine-bright: #108040;
    --c-sage: #589258;
    --c-sage-2: #477d43;
    --c-sage-tint: #e6eee1;
    --c-sage-mist: #f0f5ec;
    --c-cream: #f5f2e8;
    --c-paper: #fffdf7;
    --c-white: #ffffff;
    --c-ink: #13201a;
    --c-ink-soft: #4b5a51;
    --c-ink-faint: #7d8a82;
    --c-line: rgba(19, 32, 26, .12);
    --c-line-strong: rgba(19, 32, 26, .22);
    --c-on-dark: #f7f6ef;
    --c-on-dark-soft: rgba(247, 246, 239, .78);
    --c-pin: #e2342b;
    --c-error: #b3261e;
    --c-board: #b98a57;
    --c-board-dark: #8e6639;
    --c-metal: #c9ccd0;
    --c-metal-dark: #8d9298;
    --c-shade-top: rgba(5, 22, 8, .55);
    --c-shade-bottom: rgba(5, 22, 8, .88);
    --c-overlay: rgba(8, 30, 12, .55);
 
    --neo-section: #f2efe4;
    --neo-panel: #ebe7da;
    --neo-dark: rgba(118, 108, 82, .34);
    --neo-light: rgba(255, 255, 255, .92);
    --neo-shadow-out: 12px 12px 28px var(--neo-dark), -10px -10px 24px var(--neo-light);
    --neo-shadow-sm: 6px 6px 14px var(--neo-dark), -6px -6px 14px var(--neo-light);
    --neo-shadow-in: inset 4px 4px 9px var(--neo-dark), inset -4px -4px 9px var(--neo-light);
    --neo-ring: 0 0 0 3px rgba(16, 128, 64, .32);
    --neo-border: 1px solid rgba(118, 108, 82, .16);
 
    --f-display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    --fs-xs: .8rem;
    --fs-sm: .9rem;
    --fs-md: 1.0625rem;
    --fs-lg: 1.25rem;
    --fs-xl: clamp(1.5rem, 1.2rem + 1.4vw, 2.1rem);
    --fs-h2: clamp(2rem, 1.4rem + 2.8vw, 3.4rem);
    --fs-hero: clamp(3.1rem, 1.6rem + 7vw, 7.6rem);
    --lh-tight: 1.02;
    --lh-body: 1.55;
 
    --sp-1: .25rem; --sp-2: .5rem; --sp-3: .75rem; --sp-4: 1rem; --sp-5: 1.5rem;
    --sp-6: 2rem; --sp-7: 3rem; --sp-8: 4.5rem; --sp-9: 6.5rem;
    --gutter: 16px;
    --wrap: 1240px;
 
    --r-sm: 8px; --r-md: 14px; --r-lg: 22px; --r-pill: 999px; --r-neo: 22px; --r-neo-field: 12px;
 
    --sh-card: 0 1px 2px rgba(19, 32, 26, .06), 0 14px 34px -14px rgba(19, 32, 26, .22);
    --sh-lift: 0 2px 4px rgba(19, 32, 26, .08), 0 22px 44px -18px rgba(19, 32, 26, .32);
    --sh-board: 0 30px 60px -24px rgba(40, 26, 8, .5), 0 6px 14px rgba(40, 26, 8, .18);
 
    --ease: cubic-bezier(.2, .7, .2, 1);
    --t-fast: .15s;
    --t-med: .3s;
    --t-send: 2.4s;
    --t-stripe: 38s;
  }
  @media (min-width: 640px) { :root { --gutter: 28px; } }
  @media (min-width: 1100px) { :root { --gutter: 48px; } }
}

@layer base {
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body {
    font-family: var(--f-body);
    font-size: var(--fs-md);
    line-height: var(--lh-body);
    color: var(--c-ink);
    background: var(--c-paper);
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 600; line-height: 1.08; letter-spacing: -.01em; }
  :focus-visible { outline: 3px solid var(--c-pine-bright); outline-offset: 3px; border-radius: 4px; }
  ::selection { background: var(--c-sage-tint); }
  [hidden] { display: none !important; }
}

@layer layout {
  .l-wrap { width: 100%; max-width: calc(var(--wrap) + var(--gutter) * 2); margin-inline: auto; padding-inline: var(--gutter); }
  .l-section { padding-block: var(--sp-8); }
  @media (min-width: 960px) { .l-section { padding-block: var(--sp-9); } }
  .l-split { display: grid; gap: var(--sp-6); }
  @media (min-width: 960px) {
    .l-split { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: var(--sp-8); align-items: start; }
  }
}

@layer components {
  .c-eyebrow {
    display: inline-flex; align-items: center; gap: var(--sp-2);
    font-size: var(--fs-xs); font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
    color: var(--c-sage-2);
  }
  .c-eyebrow::before { content: ""; width: 22px; height: 2px; border-radius: 2px; background: currentColor; }
  .c-h2 { font-size: var(--fs-h2); margin-top: var(--sp-3); color: var(--c-ink); }
  .c-h2 em { font-style: normal; color: var(--c-pine); }
  .c-lede { margin-top: var(--sp-4); font-size: var(--fs-lg); color: var(--c-ink-soft); max-width: 34ch; }

  .c-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);
    min-height: 52px; padding: 0 var(--sp-5); border-radius: var(--r-pill);
    font-weight: 700; font-size: var(--fs-md); text-decoration: none; white-space: nowrap;
    transition: transform var(--t-fast) var(--ease), background var(--t-med) var(--ease), box-shadow var(--t-med) var(--ease), color var(--t-med) var(--ease);
  }
  .c-btn:active { transform: translateY(1px) scale(.99); }
  .c-btn svg { width: 20px; height: 20px; flex: none; }
  .c-btn--pine { background: var(--c-pine); color: var(--c-on-dark); box-shadow: 0 10px 24px -10px rgba(13, 95, 19, .7); }
  .c-btn--pine:hover { background: var(--c-pine-deep); }
  .c-btn--light { background: var(--c-on-dark); color: var(--c-pine-deep); }
  .c-btn--light:hover { background: var(--c-white); }
  .c-btn--glass { background: rgba(255, 255, 255, .12); color: var(--c-on-dark); border: 1.5px solid rgba(255, 255, 255, .45); backdrop-filter: blur(6px); }
  .c-btn--glass:hover { background: rgba(255, 255, 255, .22); }
  .c-btn--outline { border: 1.5px solid var(--c-line-strong); color: var(--c-ink); background: var(--c-white); }
  .c-btn--outline:hover { border-color: var(--c-pine); color: var(--c-pine); }
  .c-btn .is-pin { color: var(--c-pin); }

  .c-mark { display: block; width: 44px; height: 34px; }
  .c-mark .is-hill-a { fill: var(--c-sage); }
  .c-mark .is-hill-b { fill: var(--c-pine); }
  .c-mark .is-tree { fill: var(--c-pine); }
  .c-mark .is-tree-b { fill: var(--c-pine-bright); }

  .c-status {
    display: inline-flex; align-items: center; gap: var(--sp-2);
    font-size: var(--fs-sm); font-weight: 600;
  }
  .c-status::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--c-ink-faint); box-shadow: 0 0 0 4px rgba(125, 138, 130, .2); }
  .c-status.is-open::before { background: #3fbf5a; box-shadow: 0 0 0 4px rgba(63, 191, 90, .22); }

 
  .c-neo { background: var(--neo-panel); border-radius: var(--r-neo); padding: 30px; box-shadow: var(--neo-shadow-out); }
  .c-neo-field {
    width: 100%; min-height: 50px; padding: 12px 14px;
    background: var(--neo-panel); border: var(--neo-border); border-radius: var(--r-neo-field);
    box-shadow: var(--neo-shadow-in); color: var(--c-ink); font-size: 16px;
    transition: box-shadow var(--t-med) var(--ease);
  }
  textarea.c-neo-field { min-height: 92px; resize: vertical; line-height: 1.45; }
  .c-neo-field::placeholder { color: var(--c-ink-faint); }
  .c-neo-field:focus { outline: none; box-shadow: var(--neo-shadow-in), var(--neo-ring); }
  .c-neo-field[aria-invalid="true"] { box-shadow: var(--neo-shadow-in), 0 0 0 2px rgba(179, 38, 30, .45); }
  .c-neo-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);
    min-height: 52px; padding: 0 var(--sp-5); border-radius: var(--r-neo-field);
    background: var(--neo-panel); color: var(--c-pine); font-weight: 700; text-decoration: none;
    box-shadow: var(--neo-shadow-sm); border: var(--neo-border);
    transition: box-shadow var(--t-fast) var(--ease), color var(--t-fast) var(--ease), opacity var(--t-fast);
  }
  .c-neo-btn svg { width: 18px; height: 18px; flex: none; }
  .c-neo-btn:active:not(:disabled) { box-shadow: var(--neo-shadow-in); }
  .c-neo-btn:focus-visible { outline: none; box-shadow: var(--neo-shadow-sm), var(--neo-ring); }
  .c-neo-btn.is-primary { background: var(--c-pine); color: var(--c-on-dark); border-color: transparent; box-shadow: var(--neo-shadow-sm); }
  .c-neo-btn.is-primary:active:not(:disabled) { box-shadow: inset 4px 4px 9px rgba(0, 0, 0, .35), inset -3px -3px 8px rgba(255, 255, 255, .14); }
  .c-neo-btn:disabled { opacity: .5; cursor: not-allowed; }
  .c-neo-btn.is-ghost { color: var(--c-ink-soft); }

  .c-field { display: grid; gap: 7px; }
  .c-field__label { font-weight: 700; font-size: var(--fs-sm); color: var(--c-ink); }
  .c-field__hint { font-size: var(--fs-xs); color: var(--c-ink-soft); }
  .c-err { font-size: var(--fs-sm); font-weight: 600; color: var(--c-error); }

  .c-tile {
    position: relative; display: grid; grid-template-columns: 44px 1fr 22px; align-items: center; gap: var(--sp-3);
    min-height: 72px; padding: 12px 16px; border-radius: var(--r-neo-field);
    background: var(--neo-panel); border: var(--neo-border); box-shadow: var(--neo-shadow-sm); cursor: pointer;
    transition: box-shadow var(--t-fast) var(--ease);
  }
  .c-tile:has(input:checked) { box-shadow: var(--neo-shadow-in); }
  .c-tile:has(input:focus-visible) { box-shadow: var(--neo-shadow-sm), var(--neo-ring); }
  .c-tile:has(input:checked:focus-visible) { box-shadow: var(--neo-shadow-in), var(--neo-ring); }
  .c-tile__icon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--c-sage-tint); color: var(--c-pine); }
  .c-tile__icon svg { width: 28px; height: 28px; }
  .c-tile__name { font-weight: 700; }
  .c-tile__dot { width: 22px; height: 22px; border-radius: 50%; box-shadow: var(--neo-shadow-in); display: grid; place-items: center; }
  .c-tile__dot::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--c-pine); transform: scale(0); transition: transform var(--t-fast) var(--ease); }
  .c-tile:has(input:checked) .c-tile__dot::after { transform: scale(1); }

  .c-choice {
    min-height: 48px; padding: 0 var(--sp-4); border-radius: var(--r-neo-field);
    background: var(--neo-panel); border: var(--neo-border); box-shadow: var(--neo-shadow-sm);
    font-weight: 700; color: var(--c-ink);
    transition: box-shadow var(--t-fast) var(--ease), color var(--t-fast);
  }
  .c-choice.is-on, .c-choice[aria-pressed="true"] { box-shadow: var(--neo-shadow-in); color: var(--c-pine); }
  .c-choice:focus-visible { outline: none; box-shadow: var(--neo-shadow-sm), var(--neo-ring); }
  .c-choice.is-on:focus-visible { box-shadow: var(--neo-shadow-in), var(--neo-ring); }
}

@layer sections {
 
  .s-nav { position: absolute; inset: 0 0 auto; z-index: 5; padding-top: max(var(--sp-4), env(safe-area-inset-top)); }
  .s-nav__row { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-4); min-height: 56px; }
  .s-nav__brand { display: flex; align-items: center; gap: var(--sp-3); text-decoration: none; color: var(--c-on-dark); }
  .s-nav__badge { display: grid; place-items: center; width: 52px; height: 44px; border-radius: 12px; background: var(--c-white); padding: 4px 4px 0; }
  .s-nav__name { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; line-height: 1; }
  .s-nav__name small { display: block; font-family: var(--f-body); font-weight: 500; font-size: .74rem; opacity: .8; margin-top: 4px; letter-spacing: .02em; }
  .s-nav__links { display: none; gap: var(--sp-5); }
  .s-nav__links a { color: var(--c-on-dark); text-decoration: none; font-weight: 600; font-size: var(--fs-sm); opacity: .88; }
  .s-nav__links a:hover { opacity: 1; text-decoration: underline; text-underline-offset: 6px; }
  .s-nav__call { min-height: 44px; padding: 0 var(--sp-4); font-size: var(--fs-sm); }
  .s-nav__call span { display: none; }
  @media (min-width: 760px) { .s-nav__call span { display: inline; } }
  @media (min-width: 1000px) { .s-nav__links { display: flex; } }

 
  .s-hero { position: relative; isolation: isolate; min-height: 92svh; display: flex; align-items: flex-end; color: var(--c-on-dark); background: var(--c-pine-deep); overflow: clip; }
  .s-hero__video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; }
  .s-hero__shade { position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, var(--c-shade-top) 0%, rgba(5, 22, 8, .25) 38%, var(--c-shade-bottom) 100%); }
  .s-hero__inner { display: grid; gap: var(--sp-6); padding-top: 140px; padding-bottom: var(--sp-7); width: 100%; }
  .s-hero__line { font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: var(--fs-xs); color: var(--c-on-dark-soft); display: flex; align-items: center; gap: var(--sp-3); }
  .s-hero__line::before { content: ""; width: 28px; height: 2px; background: var(--c-sage); border-radius: 2px; }
  .s-hero__name { font-size: var(--fs-hero); font-weight: 700; line-height: .92; letter-spacing: -.025em; margin-top: var(--sp-4); text-wrap: balance; }
  .s-hero__name span { display: block; color: #b9dcae; }
  .s-hero__tag { margin-top: var(--sp-4); font-family: var(--f-display); font-weight: 500; font-size: var(--fs-xl); color: var(--c-on-dark); }
  .s-hero__ctas { display: flex; flex-wrap: wrap; gap: var(--sp-3); margin-top: var(--sp-5); }
  .s-hero__ctas .c-btn { flex: 1 1 220px; }
  .s-hero__card {
    border-radius: var(--r-lg); padding: var(--sp-5); background: rgba(8, 30, 12, .5);
    border: 1px solid rgba(255, 255, 255, .16); backdrop-filter: blur(10px);
    display: grid; gap: var(--sp-4);
  }
  .s-hero__claims { display: grid; gap: var(--sp-2); }
  .s-hero__claims li { display: flex; gap: var(--sp-3); align-items: center; font-weight: 600; }
  .s-hero__claims svg { width: 20px; height: 20px; color: #9fd08f; flex: none; }
  .s-hero__award { padding-top: var(--sp-4); border-top: 1px solid rgba(255, 255, 255, .16); display: flex; gap: var(--sp-3); align-items: center; font-size: var(--fs-sm); }
  .s-hero__award svg { width: 34px; height: 34px; flex: none; color: #e8c766; }
  .s-hero__award b { display: block; font-size: var(--fs-md); }
  .s-hero__card .c-status { color: var(--c-on-dark); }
  @media (min-width: 960px) {
    .s-hero { min-height: 100svh; }
    .s-hero__inner { grid-template-columns: minmax(0, 1fr) 340px; align-items: end; gap: var(--sp-8); padding-bottom: var(--sp-8); }
    .s-hero__ctas .c-btn { flex: 0 0 auto; }
  }

 
  .s-services { background: var(--c-paper); }
  .s-services__grid { display: grid; gap: var(--sp-6); }
  .s-services__cards { display: grid; gap: var(--sp-5); }
  .s-services__card {
    position: relative; overflow: clip; border-radius: var(--r-lg); padding: var(--sp-6) var(--sp-5) var(--sp-5);
    background: var(--c-white); border: 1px solid var(--c-line); box-shadow: var(--sh-card);
    display: grid; gap: var(--sp-3); align-content: start;
    transition: transform var(--t-med) var(--ease), box-shadow var(--t-med) var(--ease);
  }
  .s-services__card:hover { transform: translateY(-3px); box-shadow: var(--sh-lift); }
  .s-services__card::after { content: ""; position: absolute; inset: auto 0 0; height: 6px; background: repeating-linear-gradient(90deg, var(--c-pine) 0 28px, var(--c-sage) 28px 56px); }
  .s-services__num { font-family: var(--f-display); font-weight: 600; color: var(--c-sage); font-size: var(--fs-sm); letter-spacing: .1em; }
  .s-services__icon { width: 76px; height: 76px; border-radius: 20px; background: var(--c-sage-mist); color: var(--c-pine); display: grid; place-items: center; }
  .s-services__icon svg { width: 52px; height: 52px; }
  .s-services__card h3 { font-size: var(--fs-xl); margin-top: var(--sp-2); }
  .s-services__card p { color: var(--c-ink-soft); }
  .s-services__add { justify-self: start; margin-top: var(--sp-3); margin-bottom: var(--sp-2); min-height: 46px; font-size: var(--fs-sm); }
  .s-services__add[aria-pressed="true"] { background: var(--c-pine); color: var(--c-on-dark); border-color: var(--c-pine); }
  @media (min-width: 720px) { .s-services__cards { grid-template-columns: 1fr 1fr; } }
  @media (min-width: 960px) {
    .s-services__grid { grid-template-columns: minmax(0, 4fr) minmax(0, 8fr); gap: var(--sp-8); align-items: start; }
    .s-services__intro { position: sticky; top: var(--sp-7); }
    .s-services__card { padding: var(--sp-7) var(--sp-6) var(--sp-6); min-height: 380px; }
    .s-services__card:nth-child(2) { margin-top: var(--sp-8); }
  }
  .s-services__stripe { margin-top: var(--sp-8); background: var(--c-pine); color: var(--c-on-dark); overflow: clip; padding-block: var(--sp-4); }
  .s-services__track { display: flex; width: max-content; animation: stripe var(--t-stripe) linear infinite; }
  .s-services__track ul { display: flex; flex: none; }
  .s-services__track li { display: flex; align-items: center; gap: var(--sp-5); padding-right: var(--sp-5); font-family: var(--f-display); font-weight: 600; font-size: var(--fs-lg); white-space: nowrap; }
  .s-services__track li::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--c-sage); }
  @keyframes stripe { to { transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) { .s-services__track { animation: none; } }

 
  .s-prices { background: var(--c-sage-mist); position: relative; }
  .s-prices__note {
    display: inline-flex; gap: var(--sp-2); align-items: center; margin-top: var(--sp-5);
    padding: var(--sp-2) var(--sp-4); border-radius: var(--r-pill); border: 1.5px dashed var(--c-sage-2);
    color: var(--c-sage-2); font-weight: 700; font-size: var(--fs-sm); background: var(--c-white);
  }
  .s-prices__board { display: grid; gap: var(--sp-5); }
  .s-prices__group { background: var(--c-white); border-radius: var(--r-lg); padding: var(--sp-5); border: 1px solid var(--c-line); box-shadow: var(--sh-card); position: relative; }
  .s-prices__group h3 { font-size: var(--fs-xl); display: flex; align-items: center; gap: var(--sp-3); padding-bottom: var(--sp-3); border-bottom: 2px solid var(--c-sage-tint); }
  .s-prices__group h3 svg { width: 30px; height: 30px; color: var(--c-pine); }
  .s-prices__stamp { position: absolute; top: var(--sp-4); right: var(--sp-4); font-size: .68rem; font-weight: 800; letter-spacing: .16em; color: var(--c-sage-2); border: 1.5px solid currentColor; border-radius: 6px; padding: 2px 7px; transform: rotate(4deg); }
  .s-prices__row { display: flex; align-items: baseline; gap: var(--sp-3); padding-block: var(--sp-3); }

const U = {
  esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); },
  digits(s) { return String(s || "").replace(/\D/g, ""); },
  fmtPhone(v) {
    let d = U.digits(v);
    if (d.length > 10 && d[0] === "1") d = d.slice(1);
    d = d.slice(0, 10);
    if (!d) return "";
    if (d.length < 4) return "(" + d;
    if (d.length < 7) return "(" + d.slice(0, 3) + ") " + d.slice(3);
    return "(" + d.slice(0, 3) + ") " + d.slice(3, 6) + "-" + d.slice(6);
  },
  areaCode() { return SITE.phone.slice(1, 4); },
  tel() { return "tel:" + SITE.phoneE164; },
  sms(body) { return "sms:" + SITE.phoneE164 + "?&body=" + encodeURIComponent(body); },
  addrLine() { const a = SITE.address; return a.street + ", " + a.city + ", " + a.region + " " + a.zip; },
  mapsUrl() { return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(SITE.name + ", " + U.addrLine()); },
  reviewsUrl() { return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(SITE.name + " " + U.addrLine() + " reviews"); },
  toMin(t) { const p = t.split(":").map(Number); return p[0] * 60 + p[1]; },
  fmt12(min) { let h = Math.floor(min / 60); const m = min % 60; const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return h + ":" + String(m).padStart(2, "0") + " " + ap; },
  fmtShort(min) { let h = Math.floor(min / 60); const m = min % 60; const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return h + (m ? ":" + String(m).padStart(2, "0") : "") + " " + ap; },
  dayHours(dow) { const h = SITE.hours[DAYKEYS[dow]]; return h ? { open: U.toMin(h.open), close: U.toMin(h.close) } : null; },
  hoursLabel(dow) { const h = U.dayHours(dow); return h ? U.fmt12(h.open) + " - " + U.fmt12(h.close) : "Call for hours"; },
  now() {
    const f = new Intl.DateTimeFormat("en-US", { timeZone: SITE.timeZone, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23", weekday: "short" });
    const p = {}; f.formatToParts(new Date()).forEach(x => { p[x.type] = x.value; });
    const dow = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].indexOf(p.weekday);
    return { y: +p.year, m: +p.month, d: +p.day, min: (+p.hour % 24) * 60 + +p.minute, dow };
  },
  key(y, m, d) { return y + "-" + String(m).padStart(2, "0") + "-" + String(d).padStart(2, "0"); },
  parseKey(k) { const p = k.split("-").map(Number); return { y: p[0], m: p[1], d: p[2] }; },
  dowOf(y, m, d) { return new Date(Date.UTC(y, m - 1, d)).getUTCDay(); },
  dateLabel(k) { const p = U.parseKey(k); return new Date(Date.UTC(p.y, p.m - 1, p.d)).toLocaleDateString("en-US", { timeZone: "UTC", weekday: "short", month: "short", day: "numeric" }); },
  dateLong(y, m, d) { return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString("en-US", { timeZone: "UTC", weekday: "long", month: "long", day: "numeric" }); },
  slots(k) {
    const p = U.parseKey(k); const h = U.dayHours(U.dowOf(p.y, p.m, p.d));

    const out = []; const n = U.now(); const isToday = k === U.key(n.y, n.m, n.d);

  status() {

    const STEPNAMES = { service: "Service", property: "Property", when: "When", contact: "Contact", review: "Review" };
    const flow = SITE.flow;

    const g = { step: 0, address: "", name: "", phone: "", note: "", when: { mode: "flex", date: null, part: null, time: null }, calOpen: false, calMonth: null, err: "" };
    let path = "quick";

    [quick, guided].forEach(f => f.addEventListener("submit", e => e.preventDefault()));

      path = which;
      tabs.forEach(t => {
        const on = t.id === id("tab-" + which);

        if (on && focus) t.focus();
      });

    }

    tabsWrap.addEventListener("keydown", e => {
      if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
      e.preventDefault(); selectTab(path === "quick" ? "guided" : "quick", true);
    });

 
    const qName = quick.querySelector("#q-name"), qPhone = quick.querySelector("#q-phone"), qNote = quick.querySelector("#q-note"), qSend = quick.querySelector("#q-send"), qErr = quick.querySelector("#q-name-err");
    const qSync = () => { qSend.disabled = U.digits(qPhone.value).length < 7; };
    qPhone.addEventListener("input", () => { qPhone.value = U.fmtPhone(qPhone.value); qSync(); });
    qName.addEventListener("input", () => { if (qName.value.trim()) { qErr.hidden = true; qName.removeAttribute("aria-invalid"); } });
    quick.addEventListener("keydown", e => {
      if (e.key !== "Enter" || e.target.tagName === "TEXTAREA" || e.target.tagName === "BUTTON") return;

    function contactReady() { return U.digits(g.phone).length >= 7; }
    function syncNext() {
      btnNext.disabled = stepKey() === "contact" && !contactReady();
      btnNext.innerHTML = stepKey() === "review" ? "Write it up" + ICONS.check : "Next" + ICONS.right;

    function whenText() {
      const w = g.when;
      if (w.mode !== "date" || !w.date) return "Flexible";
      return [U.dateLabel(w.date), w.part, w.time !== null ? U.fmt12(w.time) : null].filter(Boolean).join(", ");
    }
    function servicesText() {
      return SITE.services.filter(s => STORE.picked.has(s.id)).map(s => s.name).join(", ");
    }

    function calHTML() {
      const n = U.now();
      if (!g.calMonth) {
        if (g.when.date) { const p = U.parseKey(g.when.date); g.calMonth = { y: p.y, m: p.m }; }
        else g.calMonth = { y: n.y, m: n.m };
      }
      const { y, m } = g.calMonth;
      const first = U.dowOf(y, m, 1);
      const days = new Date(Date.UTC(y, m, 0)).getUTCDate();
      const todayUTC = Date.UTC(n.y, n.m - 1, n.d);
      const maxUTC = todayUTC + SITE.calendarDaysAhead * 864e5;
      const atFirst = y === n.y && m === n.m;
      const lastMonth = new Date(maxUTC);
      const atLast = y === lastMonth.getUTCFullYear() && m === lastMonth.getUTCMonth() + 1;
      const label = new Date(Date.UTC(y, m - 1, 1)).toLocaleDateString("en-US", { timeZone: "UTC", month: "long", year: "numeric" });
      let cells = ["S", "M", "T", "W", "T", "F", "S"].map((d, i) => '<span class="c-cal__dow" aria-hidden="true" title="' + DAYNAMES[i] + '">' + d + '</span>').join("");
      for (let i = 0; i < first; i++) cells += '<span aria-hidden="true"></span>';
      for (let d = 1; d <= days; d++) {
        const k = U.key(y, m, d); const t = Date.UTC(y, m - 1, d);
        const ok = t >= todayUTC && t <= maxUTC && U.slots(k).length > 0;
        const on = g.when.date === k;
        cells += '<button type="button" class="c-cal__day' + (on ? ' is-on' : '') + (t === todayUTC ? ' is-today' : '') + '" data-day="' + k + '"' + (ok ? '' : ' disabled') + ' aria-label="' + U.esc(U.dateLong(y, m, d)) + (ok ? '' : ', not available') + '"' + (on ? ' aria-pressed="true"' : '') + '>' + d + '</button>';
      }
      return '<div class="c-cal" role="dialog" aria-label="Pick a date" data-cal>' +
        '<div class="c-cal__head"><button type="button" class="c-cal__nav" data-month="-1" aria-label="Previous month"' + (atFirst ? ' disabled' : '') + '>' + ICONS.left + '</button><b aria-live="polite">' + label + '</b><button type="button" class="c-cal__nav" data-month="1" aria-label="Next month"' + (atLast ? ' disabled' : '') + '>' + ICONS.right + '</button></div>' +
        '<div class="c-cal__grid">' + cells + '</div></div>';
    }

    function partsHTML() {
      const w = g.when; if (!w.date) return "";
      const slots = U.slots(w.date);
      const parts = SITE.dayParts.filter(p => slots.some(t => t >= p.from && t < p.to));
      let html = '<p class="s-request__label" id="g-part-label">Time of day</p><div class="s-request__parts" role="group" aria-labelledby="g-part-label">' +
        parts.map(p => '<button type="button" class="c-choice' + (w.part === p.name ? ' is-on' : '') + '" data-part="' + p.name + '" aria-pressed="' + (w.part === p.name) + '">' + p.name + '</button>').join("") + '</div>';
      if (w.part) {
        const p = SITE.dayParts.find(x => x.name === w.part);
        const ts = slots.filter(t => t >= p.from && t < p.to);
        html += '<p class="s-request__label" id="g-time-label">Exact time (optional)</p><div class="s-request__times" role="group" aria-labelledby="g-time-label">' +
          ts.map(t => '<button type="button" class="c-choice' + (w.time === t ? ' is-on' : '') + '" data-time="' + t + '" aria-pressed="' + (w.time === t) + '">' + U.fmt12(t) + '</button>').join("") + '</div>';
      }
      return html;
    }

    function stepHTML(k) {
      if (k === "service") {
        return '<h3 class="s-request__q" tabindex="-1" data-q>What are we doing?</h3><p class="s-request__sub">Pick one or both. Estimates are free.</p>' +
          '<div class="s-request__groups">' + SITE.pickGroups.map(grp =>
            '<fieldset class="s-request__group"><legend>' + U.esc(grp.name) + '</legend><div class="s-request__tiles">' +
            grp.items.map(sid => { const s = SITE.services.find(x => x.id === sid);
              return '<label class="c-tile"><input type="checkbox" class="u-sr" value="' + s.id + '"' + (STORE.picked.has(s.id) ? ' checked' : '') + ' aria-describedby="g-err"><span class="c-tile__icon">' + ICONS[s.icon] + '</span><span class="c-tile__name">' + U.esc(s.name) + '</span><span class="c-tile__dot" aria-hidden="true"></span></label>'; }).join("") +
            '</div></fieldset>').join("") + '</div>' + errHTML();
      }
      if (k === "property") {
        return '<h3 class="s-request__q" tabindex="-1" data-q>Where is the property?</h3><p class="s-request__sub">Street and town is plenty.</p>' +
          '<label class="c-field"><span class="c-field__label">Property address</span><input class="c-neo-field" id="g-address" autocomplete="street-address" autocapitalize="words" enterkeyhint="next" value="' + U.esc(g.address) + '" aria-describedby="g-err g-area"></label>' +
          '<p class="s-request__area" id="g-area">Primarily serving ' + U.esc(SITE.serviceArea.join(", ")) + '.</p>' + errHTML();
      }
      if (k === "when") {
        const w = g.when;
        return '<h3 class="s-request__q" tabindex="-1" data-q>When works?</h3><p class="s-request__sub">Flexible is fine.</p>' +
          '<div class="s-request__when" role="group" aria-label="When">' +
            '<button type="button" class="c-choice' + (w.mode === "flex" ? ' is-on' : '') + '" data-flex aria-pressed="' + (w.mode === "flex") + '">Flexible</button>' +
            '<button type="button" class="c-choice' + (w.mode === "date" && w.date ? ' is-on' : '') + '" data-pick aria-haspopup="dialog" aria-expanded="' + g.calOpen + '">' + (w.date ? U.esc(U.dateLabel(w.date)) : "Pick a date") + '</button>' +
          '</div>' +
          (g.calOpen ? calHTML() : partsHTML()) + errHTML();
      }
      if (k === "contact") {
        return '<h3 class="s-request__q" tabindex="-1" data-q>How do we reach you?</h3>' +
          '<label class="c-field"><span class="c-field__label">Name</span><input class="c-neo-field" id="g-name" autocomplete="name" autocapitalize="words" enterkeyhint="next" value="' + U.esc(g.name) + '" aria-describedby="g-err"></label>' +
          '<label class="c-field"><span class="c-field__label">Phone</span><input class="c-neo-field" id="g-phone" type="tel" inputmode="tel" autocomplete="tel" enterkeyhint="next" placeholder="(' + U.areaCode() + ') 555-0123" value="' + U.esc(g.phone) + '" aria-describedby="g-phone-hint g-err"><span class="c-field__hint" id="g-phone-hint">At least 7 digits so ' + U.esc(SITE.shortName) + ' can reach you.</span></label>' +
          '<label class="c-field"><span class="c-field__label">Anything else? (optional)</span><textarea class="c-neo-field" id="g-note" rows="3" autocapitalize="sentences" placeholder="Gate code, dog in the yard, best time to call">' + U.esc(g.note) + '</textarea></label>' + errHTML();
      }
      if (k === "review") {
        const rows = [
          ["Service", servicesText(), "service"],
          ["Property", g.address, "property"],
          ["When", whenText(), "when"],
          ["Name", g.name.trim(), "contact"],
          ["Phone", g.phone, "contact"],
          ["Note", g.note.trim(), "contact"]
        ].filter(r => r[1]);
        return '<h3 class="s-request__q" tabindex="-1" data-q>Look good?</h3>' +
          '<dl class="s-request__review">' + rows.map(r => '<div><dt>' + r[0] + '</dt><dd>' + U.esc(r[1]) + '</dd><button type="button" data-edit="' + r[2] + '" aria-label="Edit ' + r[0] + '">Edit</button></div>').join("") + '</dl>' + errHTML();
      }
      return "";
    }

    function renderStep(focus) {
      const k = stepKey();
      stepline.innerHTML = 'Step ' + (g.step + 1) + ' of ' + flow.length + ' · <b>' + STEPNAMES[k] + '</b>';
      bar.style.width = ((g.step + 1) / flow.length * 100) + "%";
      btnBack.hidden = g.step === 0;
      body.innerHTML = stepHTML(k);
      syncNext();
      if (focus) { const q = body.querySelector("[data-q]"); if (q) q.focus({ preventScroll: true }); }
    }
    function go(i) { g.step = i; g.err = ""; g.calOpen = false; renderStep(true); }

    function validate() {
      const k = stepKey();
      if (k === "service" && STORE.picked.size === 0) { setErr("Pick at least one service.", body.querySelector(".s-request__groups")); return false; }
      if (k === "property" && !g.address.trim()) { const f = body.querySelector("#g-address"); setErr("Add the property address.", f); f.focus(); return false; }
      if (k === "when" && g.calOpen && !g.when.date) { setErr("Pick a date, or choose Flexible."); return false; }
      if (k === "contact" && (!g.name.trim() || !contactReady())) { const f = !g.name.trim() ? body.querySelector("#g-name") : body.querySelector("#g-phone"); setErr("Add your name and at least 7 digits.", f); f.focus(); return false; }
      return true;
    }
    function next() {
      if (btnNext.disabled) return;
      if (!validate()) return;
      if (stepKey() === "when" && g.calOpen) g.calOpen = false;
      if (g.step === flow.length - 1) { finish("guided"); return; }
      go(g.step + 1);
    }
    btnNext.addEventListener("click", next);
    btnBack.addEventListener("click", () => { if (g.step > 0) go(g.step - 1); });

    body.addEventListener("change", e => {
      if (e.target.matches('input[type="checkbox"]')) { STORE.toggle(e.target.value, e.target.checked); if (STORE.picked.size) setErr(""); }
    });
    body.addEventListener("input", e => {
      const t = e.target;
      if (t.id === "g-address") { g.address = t.value; if (t.value.trim()) setErr(""); }
      if (t.id === "g-name") { g.name = t.value; if (t.value.trim() && contactReady()) setErr(""); }
      if (t.id === "g-phone") { t.value = U.fmtPhone(t.value); g.phone = t.value; syncNext(); if (g.name.trim() && contactReady()) setErr(""); }
      if (t.id === "g-note") g.note = t.value;
    });
    guided.addEventListener("keydown", e => {
      if (e.key === "Escape" && g.calOpen) { e.preventDefault(); g.calOpen = false; renderStep(false); const b = body.querySelector("[data-pick]"); if (b) b.focus(); return; }
      if (e.key !== "Enter") return;
      const t = e.target;
      if (t.tagName === "TEXTAREA" || t.tagName === "BUTTON") return;
      e.preventDefault();
      if (t.type === "checkbox") { t.click(); return; }
      if (t.id === "g-name") { body.querySelector("#g-phone").focus(); return; }
      if (t.id === "g-phone") { body.querySelector("#g-note").focus(); return; }
      next();
    });
    body.addEventListener("click", e => {
      const t = e.target.closest("button"); if (!t) return;
      const w = g.when;
      if (t.hasAttribute("data-flex")) { g.when = { mode: "flex", date: null, part: null, time: null }; g.calOpen = false; setErr(""); renderStep(false); body.querySelector("[data-flex]").focus(); return; }
      if (t.hasAttribute("data-pick")) { g.calOpen = !g.calOpen; g.calMonth = null; renderStep(false); const f = body.querySelector(g.calOpen ? ".c-cal__day:not(:disabled)" : "[data-pick]"); if (f) f.focus(); return; }
      if (t.dataset.month) { g.calMonth.m += +t.dataset.month; if (g.calMonth.m < 1) { g.calMonth.m = 12; g.calMonth.y--; } if (g.calMonth.m > 12) { g.calMonth.m = 1; g.calMonth.y++; } renderStep(false); const f = body.querySelector('[data-month="' + t.dataset.month + '"]'); if (f && !f.disabled) f.focus(); else { const d = body.querySelector(".c-cal__day:not(:disabled)"); if (d) d.focus(); } return; }
      if (t.dataset.day) { g.when = { mode: "date", date: t.dataset.day, part: null, time: null }; g.calOpen = false; setErr(""); renderStep(false); const f = body.querySelector("[data-part]"); if (f) f.focus(); return; }
      if (t.dataset.part) { w.part = w.part === t.dataset.part ? null : t.dataset.part; w.time = null; renderStep(false); const f = body.querySelector('[data-part="' + t.dataset.part + '"]'); if (f) f.focus(); return; }
      if (t.dataset.time) { const v = +t.dataset.time; w.time = w.time === v ? null : v; renderStep(false); const f = body.querySelector('[data-time="' + v + '"]'); if (f) f.focus(); return; }
      if (t.dataset.edit) { go(flow.indexOf(t.dataset.edit)); return; }
    });

    document.addEventListener("blc:picked", () => {
      if (path === "guided" && stepKey() === "service" && !guided.hidden) {
        body.querySelectorAll('input[type="checkbox"]').forEach(c => { c.checked = STORE.picked.has(c.value); });
      }
    });
    document.addEventListener("blc:add", () => {
      result.hidden = true; tabsWrap.hidden = false;
      g.step = 0; g.err = ""; g.calOpen = false;
      selectTab("guided", false);
      el.scrollIntoView({ behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
      const q = body.querySelector("[data-q]"); if (q) q.focus({ preventScroll: true });
    });

 
    function summary(which) {
      const lines = ["Hi " + SITE.name + ",", ""];
      if (which === "quick") {
        lines.push("Please give me a call back.", "", "Name: " + qName.value.trim(), "Phone: " + qPhone.value);
        if (qNote.value.trim()) lines.push("Note: " + qNote.value.trim());
      } else {
        lines.push("I'd like a free estimate.", "", "Service: " + servicesText(), "Property: " + g.address.trim(), "When: " + whenText(), "Name: " + g.name.trim(), "Phone: " + g.phone);
        if (g.note.trim()) lines.push("Note: " + g.note.trim());
      }
      return lines.join("\n");
    }
    function finish(which) {
      const text = summary(which);
      result.innerHTML =
        '<h3 tabindex="-1" data-done>Your request is ready</h3>' +
        '<p>Send it to ' + U.esc(SITE.name) + ' by text, or call and read it off.</p>' +
        '<pre class="s-request__summary">' + U.esc(text) + '</pre>' +
        '<div class="s-request__actions">' +
          '<a class="c-neo-btn is-primary is-wide" href="' + U.sms(text) + '">Text it to ' + U.esc(SITE.shortName) + '</a>' +
          '<a class="c-neo-btn is-wide" href="' + U.tel() + '">' + ICONS.phone + 'Call ' + U.esc(SITE.phone) + '</a>' +
          '<button type="button" class="c-neo-btn" data-copy>Copy</button>' +
          '<button type="button" class="c-neo-btn is-ghost" data-edit-path>Edit</button>' +
        '</div>';
      result.querySelector("[data-copy]").addEventListener("click", async e => {
        const b = e.currentTarget; let ok = false;
        try { await navigator.clipboard.writeText(text); ok = true; } catch (err) {
          try { const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); ok = document.execCommand("copy"); ta.remove(); } catch (err2) { ok = false; }
        }
        b.textContent = ok ? "Copied" : "Select and copy above";
        setTimeout(() => { b.textContent = "Copy"; }, 2200);
      });
      result.querySelector("[data-edit-path]").addEventListener("click", () => {
        result.hidden = true; tabsWrap.hidden = false;
        selectTab(which, false);
        if (which === "guided") { g.step = flow.length - 1; renderStep(true); } else qName.focus();
      });
      tabsWrap.hidden = true; quick.hidden = true; guided.hidden = true; result.hidden = false;
      SEND.play(() => { const h = result.querySelector("[data-done]"); if (h) h.focus(); });
    }

    renderStep(false);
  },

  footer(el) {
    el.innerHTML =
      '<div class="l-wrap s-footer__row">' +
        '<div class="s-footer__brand"><span class="s-nav__badge">' + U.mark() + '</span><div><p class="s-footer__name">' + U.esc(SITE.name) + '</p>' +
        '<p class="s-footer__meta">' + U.esc(SITE.town) + ' · <a href="' + U.tel() + '">' + U.esc(SITE.phone) + '</a></p></div></div>' +
        '<nav class="s-footer__links" aria-label="Footer"><a href="#services">Services</a><a href="#work">Recent Work</a><a href="#visit">Visit</a></nav>' +
      '</div>';
  },

  studio(el) {
    el.innerHTML = '<a href="' + SITE.studio + '" target="_blank" rel="noopener">Message me about this site</a>';
  },

  jump(el) {
    el.innerHTML = '<a class="is-req" href="#request">Request</a><button type="button" class="is-top" aria-label="Back to top">' + ICONS.up + '</button>';
    el.querySelector(".is-top").addEventListener("click", () => window.scrollTo({ top: 0, behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }));
    const req = el.querySelector(".is-req");
    let pastHero = false, formOn = false;
    const apply = () => { el.classList.toggle("is-shown", pastHero); req.hidden = formOn; };
    if ("IntersectionObserver" in window) {
      const hero = document.getElementById("top"), form = document.getElementById("request");
      new IntersectionObserver(es => { es.forEach(x => { pastHero = !x.isIntersecting; }); apply(); }, { threshold: 0.05 }).observe(hero);
      new IntersectionObserver(es => { es.forEach(x => { formOn = x.isIntersecting; }); apply(); }, { threshold: 0.08 }).observe(form);
    }
    const lift = () => {
      let h = 0;
      document.querySelectorAll("[data-tray]").forEach(t => { if (t.offsetParent !== null) h = Math.max(h, t.getBoundingClientRect().height + 12); });
      el.style.setProperty("--jump-lift", h + "px");
    };
    lift(); window.addEventListener("resize", lift);
  }
};

const SEND = {
  play(done) {
    const ov = document.createElement("div");
    ov.className = "s-send"; ov.setAttribute("role", "status"); ov.setAttribute("aria-label", "Writing up your request");
    const stripes = Array.from({ length: 6 }, (_, i) => '<rect x="' + (i * 50) + '" y="62" width="25" height="38" fill="var(--c-pine)" opacity=".16"/>').join("");
    const blades = Array.from({ length: 40 }, (_, i) => { const x = 4 + i * 7.4; const h = 10 + (i * 7 % 9); return '<path d="M' + x + ' 64 l' + (i % 2 ? 2 : -2) + ' -' + h + '" stroke="var(--c-sage)" stroke-width="2.4" stroke-linecap="round"/>'; }).join("");
    ov.innerHTML =
      '<div class="s-send__card"><svg viewBox="0 0 300 120" aria-hidden="true">' +
        '<rect x="0" y="62" width="300" height="38" rx="6" fill="var(--c-sage-tint)"/>' +
        '<g>' + blades + '</g>' +
        '<g class="is-cut"><rect x="0" y="40" width="300" height="30" fill="var(--c-paper)"/><rect x="0" y="62" width="300" height="38" rx="6" fill="var(--c-sage-tint)"/>' + stripes + '</g>' +
        '<g class="is-mower">' +
          '<path d="M10 22 L28 52" stroke="var(--c-ink)" stroke-width="3" stroke-linecap="round"/><path d="M5 22h10" stroke="var(--c-ink)" stroke-width="3.4" stroke-linecap="round"/>' +
          '<path d="M22 52h30a8 8 0 0 1 8 8v3H18v-6a5 5 0 0 1 4-5z" fill="var(--c-pine)"/><path d="M32 52v-6h14l5 6" fill="none" stroke="var(--c-pine-deep)" stroke-width="3" stroke-linejoin="round"/>' +
          '<g class="is-wheel"><circle cx="25" cy="66" r="6.5" fill="var(--c-ink)"/><path d="M25 61v10" stroke="var(--c-paper)" stroke-width="1.6"/></g>' +
          '<g class="is-wheel"><circle cx="55" cy="66" r="6.5" fill="var(--c-ink)"/><path d="M55 61v10" stroke="var(--c-paper)" stroke-width="1.6"/></g>' +
          '<g class="is-clip"><path d="M14 58l-3-4M10 62l-4-1M16 55l-1-5" stroke="var(--c-sage)" stroke-width="2" stroke-linecap="round"/></g>' +
        '</g>' +
        '<g class="is-check"><circle cx="150" cy="30" r="22" fill="var(--c-pine)"/><path d="M140 30l7 7 13-14" fill="none" stroke="var(--c-white)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>' +
      '</svg><p>Writing it up</p></div>';
    document.body.appendChild(ov);
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const dur = reduce ? 1300 : (parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--t-send")) || 2.4) * 1000 + 500;
    let closed = false;
    const close = () => { if (closed) return; closed = true; ov.remove(); if (done) done(); };
    setTimeout(() => { const p = ov.querySelector("p"); if (p) p.textContent = "Your request is ready"; }, dur * .78);
    setTimeout(close, dur);
    ov.addEventListener("click", close);
  }
};

function buildSchema() {
  const a = SITE.address;
  const hoursSpec = DAYKEYS.map((k, i) => SITE.hours[k] ? { "@type": "OpeningHoursSpecification", dayOfWeek: DAYNAMES[i], opens: SITE.hours[k].open, closes: SITE.hours[k].close } : null).filter(Boolean);
  const data = {
    "@context": "https://schema.org",
    "@type": "HomeAndConstructionBusiness",
    additionalType: "https://en.wikipedia.org/wiki/Landscaping",
    name: SITE.name,
    slogan: SITE.tagline,
    telephone: SITE.phoneE164,
    address: { "@type": "PostalAddress", streetAddress: a.street, addressLocality: a.city, addressRegion: a.region, postalCode: a.zip, addressCountry: "US" },
    openingHoursSpecification: hoursSpec,
    areaServed: SITE.serviceArea.map(n => ({ "@type": "Place", name: n + ", PA" })),
    sameAs: [SITE.facebook],
    makesOffer: SITE.services.map(s => ({ "@type": "Offer", itemOffered: { "@type": "Service", name: s.name } }))
  };
  const s = document.createElement("script");
  s.type = "application/ld+json"; s.textContent = JSON.stringify(data);
  document.head.appendChild(s);
}

(function boot() {
  try { buildSchema(); } catch (e) { console.warn("schema", e); }
  document.querySelectorAll("[data-module]").forEach(el => {
    const name = el.dataset.module;
    try { if (MODULES[name]) MODULES[name](el); } catch (e) { console.warn("module " + name + " failed", e); }
  });
})();
