  .s-send { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: var(--c-overlay); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); padding: var(--gutter); }
  .s-send__card { display: grid; justify-items: center; gap: var(--sp-4); }
  .s-send__env { width: min(300px, 78vw); overflow: visible; filter: drop-shadow(0 24px 36px rgba(0,0,0,.4)); }
  .s-send__env .env-body { fill: var(--c-cream); }
  .s-send__env .env-lines { fill: none; stroke: rgba(16, 64, 80, .35); stroke-width: 2; }
  .s-send__env .env-flap { fill: var(--c-cream-2); stroke: rgba(16, 64, 80, .35); stroke-width: 2; transform-box: fill-box; transform-origin: 50% 0; }
  .s-send__env .env-edge { fill: none; stroke: url(#envAir); stroke-width: 6; }
  .s-send__env .env-stamp rect.bg { fill: var(--c-red); }
  .s-send__env .env-stamp rect.edge { fill: none; stroke: var(--c-cream); stroke-width: 3; stroke-dasharray: 3 3; }
  .s-send__env .env-stamp path, .s-send__env .env-stamp circle { fill: none; stroke: var(--c-cream); stroke-width: 1.6; stroke-linecap: round; }
  .s-send__env .env-stamp, .s-send__env .env-mark { transform-box: fill-box; transform-origin: center; }
  .s-send__env .env-mark { color: var(--c-navy); }
  .s-send__env .env-mark circle { fill: none; stroke: currentColor; stroke-width: 2; }
  .s-send__env .env-mark path.wave { fill: none; stroke: currentColor; stroke-width: 2; }
  .s-send__env .env-mark text { fill: currentColor; font-family: var(--font-mono); font-weight: 700; font-size: 7.5px; letter-spacing: 1px; }
  .s-send__msg { font-family: var(--font-display); font-style: italic; font-size: 1.4rem; color: var(--c-cream); text-align: center; }
  .s-send.is-playing { animation: fade-in .2s var(--ease) both; }
  .s-send.is-playing .s-send__env { animation: env-in .38s var(--ease) both, env-out .5s 1.45s var(--ease-in) forwards; }
  .s-send.is-playing .env-flap { animation: flap .36s .34s var(--ease) both; }
  .s-send.is-playing .env-stamp { animation: stamp-in .3s .7s var(--ease) both; }
  .s-send.is-playing .env-mark { animation: mark-in .26s 1.02s var(--ease) both; }
  .s-send.is-playing .s-send__msg { animation: fade-in .3s .9s var(--ease) both, fade-out .3s 1.55s ease forwards; }
  .s-send.is-calm { animation: fade-in .3s ease both; }
  .s-send.is-calm .s-send__msg { animation: fade-in .3s .1s ease both; }
  .s-send.is-leaving { animation: fade-out .25s ease forwards; }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fade-out { to { opacity: 0; } }
  @keyframes env-in { from { opacity: 0; transform: translateY(36px) scale(.94); } to { opacity: 1; transform: none; } }
  @keyframes env-out { to { opacity: 0; transform: translate(70vw, -40px) rotate(14deg); } }
  @keyframes flap { from { transform: scaleY(-1); } to { transform: scaleY(1); } }
  @keyframes stamp-in { from { opacity: 0; transform: scale(1.9) rotate(-16deg); } to { opacity: 1; transform: rotate(4deg); } }
  @keyframes mark-in { from { opacity: 0; transform: scale(1.5) rotate(-12deg); } to { opacity: .9; transform: rotate(-12deg); } }
}

@layer utilities {
  .u-sr { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .u-full { width: 100%; }
  .u-mt-0 { margin-top: 0; }
}
</style>

        const qn = $('#q-name'), gn = $('#g-name'), qp = $('#q-phone'), gp = $('#g-phone');
        if (p === 'guided') { if (!gn.value) gn.value = qn.value; if (!gp.value) gp.value = qp.value; }
        else { if (!qn.value) qn.value = gn.value; if (!qp.value) qp.value = gp.value; }
        updateQuick(); updateNext();
        if (focusTab) tabs[p === 'quick' ? 0 : 1].focus();
      }
      tabs.forEach((t, i) => {
        t.addEventListener('click', () => setPath(i === 0 ? 'quick' : 'guided'));
        t.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); setPath(st.path === 'quick' ? 'guided' : 'quick', true); }
        });
      });

      const qName = $('#q-name'), qPhone = $('#q-phone'), qNote = $('#q-note'), qSend = $('[data-act="quick-send"]'), qNameErr = $('#q-name-err');
      function updateQuick() { qSend.disabled = digits(qPhone.value) < 7; }
      wirePhone(qPhone, updateQuick);
      qName.addEventListener('input', () => { if (qName.value.trim()) showErr(qName, qNameErr, false); });
      qName.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); qPhone.focus(); } });
      qPhone.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); qNote.focus(); } });
      qSend.addEventListener('click', () => {
        if (digits(qPhone.value) < 7) return;
        if (!qName.value.trim()) { showErr(qName, qNameErr, true); qName.focus(); return; }
        const lines = ['Name: ' + qName.value.trim(), 'Phone: ' + qPhone.value];
        if (qNote.value.trim()) lines.push('Note: ' + qNote.value.trim());
        finish('quick', lines);
      });

      const tiles = Array.from(panel.querySelectorAll('.c-tile'));
      const svcErr = $('#g-svc-err');
      const syncTiles = () => {
        tiles.forEach((t) => {
          const on = STORE.selected.has(t.dataset.id);
          t.classList.toggle('is-on', on);
          t.querySelector('input').checked = on;
        });
        if (STORE.selected.size) svcErr.hidden = true;
      };
      tiles.forEach((t) => t.querySelector('input').addEventListener('change', (e) => STORE.toggle(t.dataset.id, e.target.checked)));
      STORE.on(syncTiles);
      syncTiles();

      const flexBtn = $('[data-when="flexible"]'), dateBtn = $('[data-when="date"]'), dateLbl = slot(panel, 'date-label');
      const cal = $('#g-cal'), partsWrap = slot(panel, 'parts-wrap'), partsEl = slot(panel, 'parts'), timesWrap = slot(panel, 'times-wrap'), timesEl = slot(panel, 'times');
      const whenErr = $('#g-when-err');

      function renderWhen() {
        const w = st.when;
        flexBtn.setAttribute('aria-pressed', String(w.mode === 'flexible' && !st.calOpen));
        dateBtn.setAttribute('aria-pressed', String(st.calOpen || !!w.date));
        dateBtn.setAttribute('aria-expanded', String(st.calOpen));
        dateLbl.textContent = w.date ? dateLabel(w.date) : 'Pick a date';
        cal.hidden = !st.calOpen;
        if (st.calOpen) renderCal();
        if (w.date && !st.calOpen) {
          const slots = availableSlots(w.date.y, w.date.m, w.date.d);
          const parts = PARTS.filter((p) => slots.some((t) => t >= p.from && t < p.to));
          partsWrap.hidden = false;
          partsEl.innerHTML = parts.map((p) => '<button type="button" class="c-chip" data-part="' + p.id + '" aria-pressed="' + (w.part === p.id) + '">' + p.label + '</button>').join('');
          const part = PARTS.find((p) => p.id === w.part);
          if (part) {
            const ts = slots.filter((t) => t >= part.from && t < part.to);
            timesWrap.hidden = false;
            timesEl.innerHTML = ts.map((t) => '<button type="button" class="c-chip" data-time="' + t + '" aria-pressed="' + (w.time === t) + '">' + fmtMin(t) + '</button>').join('');
          } else { timesWrap.hidden = true; timesEl.innerHTML = ''; }
        } else { partsWrap.hidden = true; timesWrap.hidden = true; partsEl.innerHTML = ''; timesEl.innerHTML = ''; }
      }
      function renderCal() {
        const now = tzNow();
        if (!st.view) st.view = st.when.date ? { y: st.when.date.y, m: st.when.date.m } : { y: now.y, m: now.m };
        const { y, m } = st.view;
        const first = new Date(Date.UTC(y, m, 1));
        const startDow = first.getUTCDay();
        const nDays = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
        const max = addDays(now, SITE.bookAheadDays);
        const canPrev = (y * 12 + m) > (now.y * 12 + now.m);
        const canNext = (y * 12 + m) < (max.y * 12 + max.m);
        const monthName = first.toLocaleDateString('en-US', { month: 'long', year: 'numeric', timeZone: 'UTC' });
        let cells = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'].map((d) => '<span class="c-cal__dow" aria-hidden="true">' + d + '</span>').join('');
        for (let i = 0; i < startDow; i++) cells += '<span aria-hidden="true"></span>';
        for (let d = 1; d <= nDays; d++) {
          const ok = availableSlots(y, m, d).length > 0;
          const sel = st.when.date && st.when.date.y === y && st.when.date.m === m && st.when.date.d === d;
          cells += '<button type="button" class="c-cal__day" data-day="' + d + '"' + (ok ? '' : ' disabled') + ' aria-pressed="' + !!sel + '" aria-label="' + esc(dateLong(y, m, d)) + (ok ? '' : ', unavailable') + '">' + d + '</button>';
        }
        cal.innerHTML = '<div class="c-cal__head"><button type="button" class="c-cal__nav" data-cal="prev" aria-label="Previous month"' + (canPrev ? '' : ' disabled') + '>' + ICONS.left + '</button><p class="c-cal__month" aria-live="polite">' + esc(monthName) + '</p><button type="button" class="c-cal__nav" data-cal="next" aria-label="Next month"' + (canNext ? '' : ' disabled') + '>' + ICONS.right + '</button></div><div class="c-cal__grid">' + cells + '</div>';
      }
      flexBtn.addEventListener('click', () => {
        st.when = { mode: 'flexible', date: null, part: null, time: null };
        st.calOpen = false; whenErr.hidden = true; renderWhen();
      });
      dateBtn.addEventListener('click', () => {
        st.calOpen = !st.calOpen;
        if (st.calOpen) { st.when.mode = 'date'; st.view = null; }
        else if (!st.when.date) { st.when.mode = 'flexible'; whenErr.hidden = true; }
        renderWhen();
        if (st.calOpen) { const f = cal.querySelector('.c-cal__day:not([disabled])'); if (f) f.focus(); }
      });
      cal.addEventListener('click', (e) => {
        const nav = e.target.closest('[data-cal]');
        if (nav && !nav.disabled) {
          let { y, m } = st.view;
          m += nav.dataset.cal === 'next' ? 1 : -1;
          if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; }
          st.view = { y, m }; renderCal();
          const again = cal.querySelector('[data-cal="' + nav.dataset.cal + '"]');
          if (again && !again.disabled) again.focus();
          return;
        }
        const day = e.target.closest('[data-day]');
        if (day && !day.disabled) {
          st.when = { mode: 'date', date: { y: st.view.y, m: st.view.m, d: +day.dataset.day }, part: null, time: null };
          st.calOpen = false; whenErr.hidden = true; renderWhen();
          const fp = partsEl.querySelector('button'); if (fp) fp.focus(); else dateBtn.focus();
        }
      });
      cal.addEventListener('keydown', (e) => { if (e.key === 'Escape') { e.preventDefault(); dateBtn.click(); dateBtn.focus(); } });
      partsEl.addEventListener('click', (e) => {
        const b = e.target.closest('[data-part]'); if (!b) return;
        st.when.part = b.dataset.part; st.when.time = null; renderWhen();
        const again = partsEl.querySelector('[data-part="' + b.dataset.part + '"]'); if (again) again.focus();
      });
      timesEl.addEventListener('click', (e) => {
        const b = e.target.closest('[data-time]'); if (!b) return;
        const t = +b.dataset.time;
        st.when.time = st.when.time === t ? null : t; renderWhen();
        const again = timesEl.querySelector('[data-time="' + t + '"]'); if (again) again.focus();
      });
      function whenText() {
        const w = st.when;
        if (w.mode !== 'date' || !w.date) return 'Flexible';
        let s = dateLabel(w.date);
        const p = PARTS.find((x) => x.id === w.part);
        if (p) s += ', ' + p.label;
        if (w.time != null) s += ', ' + fmtMin(w.time);
        return s;
      }

      const gName = $('#g-name'), gPhone = $('#g-phone'), gBarber = $('#g-barber'), gNote = $('#g-note'), contactErr = $('#g-contact-err');
      const nextBtn = $('[data-act="next"]'), backBtn = $('[data-act="back"]');
      function updateNext() {
        const step = FLOW[st.step];
        nextBtn.disabled = step === 'contact' && digits(gPhone.value) < 7;
        nextBtn.innerHTML = step === 'review' ? 'Write it up' : 'Next' + ICONS.right;
      }
      wirePhone(gPhone, () => { updateNext(); if (gName.value.trim() && digits(gPhone.value) >= 7) showErr(gName, contactErr, false); });
      gName.addEventListener('input', () => { if (gName.value.trim()) showErr(gName, contactErr, false); });
      [gName, gPhone, gBarber].forEach((inp) => inp.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); if (!nextBtn.disabled) nextBtn.click(); }
      }));

      const rows = slot(panel, 'rows');
      function renderReview() {
        const items = [
          ['Services', SITE.services.filter((s) => STORE.selected.has(s.id)).map((s) => s.name).join(', '), 0],
          ['When', whenText(), 1],
          ['Name', gName.value.trim(), 2],
          ['Phone', gPhone.value, 2],
          ['Preferred barber', gBarber.value.trim(), 2],
          ['Note', gNote.value.trim(), 2]
        ].filter((r) => r[1]);
        rows.innerHTML = items.map((r) => '<div class="c-row"><dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd><button type="button" data-goto="' + r[2] + '" aria-label="Edit ' + esc(r[0].toLowerCase()) + '">Edit</button></div>').join('');
      }
      rows.addEventListener('click', (e) => { const b = e.target.closest('[data-goto]'); if (b) goStep(+b.dataset.goto, true); });

      function goStep(n, focus) {
        st.step = n;
        FLOW.forEach((name, i) => { pGuided.querySelector('[data-step="' + name + '"]').hidden = i !== n; });
        slot(panel, 'g-num').textContent = String(n + 1);
        slot(panel, 'g-name').textContent = LABEL[FLOW[n]];
        slot(panel, 'g-bar').style.width = ((n + 1) / FLOW.length * 100) + '%';
        backBtn.hidden = n === 0;
        if (FLOW[n] === 'when') renderWhen();
        if (FLOW[n] === 'review') renderReview();
        updateNext();
        if (focus) {
          const q = pGuided.querySelector('[data-step="' + FLOW[n] + '"] .s-request__q');
          if (q) q.focus({ preventScroll: true });
          const r = panel.getBoundingClientRect();
          if (r.top < 0 || r.top > window.innerHeight * .6) scrollToEl(panel);
        }
      }
      nextBtn.addEventListener('click', () => {
        const step = FLOW[st.step];
        if (step === 'service' && !STORE.selected.size) { svcErr.hidden = false; return; }
        if (step === 'when' && st.calOpen && !st.when.date) { whenErr.hidden = false; return; }
        if (step === 'contact') {
          if (digits(gPhone.value) < 7) return;
          if (!gName.value.trim()) { showErr(gName, contactErr, true); gName.focus(); return; }
        }
        if (step === 'review') {
          const lines = ['Name: ' + gName.value.trim(), 'Phone: ' + gPhone.value, 'Services: ' + SITE.services.filter((s) => STORE.selected.has(s.id)).map((s) => s.name).join(', '), 'When: ' + whenText()];
          if (gBarber.value.trim()) lines.push('Preferred barber: ' + gBarber.value.trim());
          if (gNote.value.trim()) lines.push('Note: ' + gNote.value.trim());
          finish('guided', lines);
          return;
        }
        if (step === 'when' && st.calOpen) { st.calOpen = false; renderWhen(); }
        goStep(st.step + 1, true);
      });
      backBtn.addEventListener('click', () => goStep(Math.max(0, st.step - 1), true));

      const summaryEl = slot(panel, 'summary');
      const smsBtn = $('[data-act="sms"]');
      const copyBtn = $('[data-act="copy"]');
      let summary = '';
      async function finish(path, lines) {
        st.lastPath = path;
        summary = 'Hi ' + SITE.name + ',\n\n' + lines.join('\n');
        summaryEl.textContent = summary;
        smsBtn.href = LINKS.sms(summary);
        if (API.playSend) { try { await API.playSend(); } catch (e) { console.error(e); } }
        switcher.hidden = true; form.hidden = true; result.hidden = false;
        slot(panel, 'result-title').focus({ preventScroll: true });
        const r = panel.getBoundingClientRect();
        if (r.top < 0 || r.top > window.innerHeight * .5) scrollToEl(panel);
      }
      copyBtn.addEventListener('click', async () => {
        let ok = false;
        try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(summary); ok = true; } } catch (e) { ok = false; }
        if (!ok) {
          try {
            const ta = document.createElement('textarea');
            ta.value = summary; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); ta.remove();
          } catch (e) { ok = false; }
        }
        if (!ok) { const r = document.createRange(); r.selectNodeContents(summaryEl); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }
        copyBtn.textContent = ok ? 'Copied' : 'Selected, copy it';
        setTimeout(() => { copyBtn.textContent = 'Copy'; }, 2200);
      });
      function backToForm(path) {
        result.hidden = true; switcher.hidden = false; form.hidden = false;
        setPath(path);
      }
      $('[data-act="edit"]').addEventListener('click', () => {
        backToForm(st.lastPath);
        if (st.lastPath === 'guided') goStep(FLOW.length - 1, true); else qName.focus();
      });

      API.openGuided = () => {
        if (!result.hidden) backToForm('guided'); else setPath('guided');
        goStep(0, false);
        scrollToEl(root);
      };

      setPath('quick');
      goStep(0, false);
    },

    footer(root) {
      slot(root, 'name').textContent = SITE.name;
      slot(root, 'line').innerHTML = esc(SITE.address.city + ', ' + SITE.address.region) + ' · <a href="' + LINKS.tel + '">' + esc(SITE.phone) + '</a>';
      slot(root, 'links').innerHTML = [['#services', 'Services'], ['#work', 'Recent Work'], ['#visit', 'Visit']].map((l) => '<a href="' + l[0] + '">' + l[1] + '</a>').join('');
    },

    studio(root) {
      const a = slot(root, 'link');
      a.href = SITE.studio;
      a.textContent = 'Message me about this site';
    },

    jump(root) {
      const req = slot(root, 'req'), up = slot(root, 'up');
      req.innerHTML = ICONS.mail + 'Request';
      up.innerHTML = ICONS.up;
      up.setAttribute('aria-label', 'Back to top');
      up.addEventListener('click', () => window.scrollTo({ top: 0, behavior: reduced() ? 'auto' : 'smooth' }));
      const hero = document.getElementById('top');
      const reqSec = document.getElementById('request');
      let ticking = false;
      const update = () => {
        ticking = false;
        const vh = window.innerHeight;
        const past = hero.getBoundingClientRect().bottom < vh * .35;
        const rr = reqSec.getBoundingClientRect();
        const inReq = rr.top < vh * .85 && rr.bottom > vh * .15;
        root.classList.toggle('is-shown', past);
        req.classList.toggle('is-off', inReq);
        let overlap = false;
        if (past) {
          const jr = root.getBoundingClientRect();
          reqSec.querySelectorAll('.c-neu-btn, .c-chip, .c-tile, input, textarea').forEach((b) => {
            if (overlap || !b.offsetParent) return;
            const br = b.getBoundingClientRect();
            if (br.left < jr.right + 8 && br.right > jr.left - 8 && br.top < jr.bottom + 8 && br.bottom > jr.top - 8) overlap = true;
          });
        }
        root.classList.toggle('is-tucked', overlap);
      };
      const onScroll = () => { if (!ticking) { ticking = true; requestAnimationFrame(update); } };
      window.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('resize', onScroll);
      document.addEventListener('click', () => setTimeout(onScroll, 50));
      update();
    },

    send(root) {
      slot(root, 'mark-top').textContent = SITE.address.city.toUpperCase() + ' ' + SITE.address.region;
      slot(root, 'mark-mid').textContent = SITE.address.zip;
      slot(root, 'msg').textContent = SITE.copy.sendMsg;
      API.playSend = () => new Promise((resolve) => {
        const calm = reduced();
        root.hidden = false;
        root.classList.remove('is-playing', 'is-calm', 'is-leaving');
        void root.offsetWidth;
        root.classList.add(calm ? 'is-calm' : 'is-playing');
        const hold = calm ? 900 : 1950;
        setTimeout(() => {
          root.classList.add('is-leaving');
          setTimeout(() => { root.hidden = true; root.classList.remove('is-playing', 'is-calm', 'is-leaving'); resolve(); }, 250);
        }, hold);
      });
    }
  };

  function schema() {
    const data = {
      '@context': 'https://schema.org',
      '@type': SITE.schemaType,
      name: SITE.name,
      description: SITE.kind + ' in ' + SITE.address.city + ', ' + SITE.address.region,
      telephone: SITE.phoneE164,
      address: { '@type': 'PostalAddress', streetAddress: SITE.address.street, addressLocality: SITE.address.city, addressRegion: SITE.address.region, postalCode: SITE.address.zip, addressCountry: 'US' },
      hasMap: LINKS.maps,
      sameAs: [SITE.facebook],
      openingHoursSpecification: SITE.hours.filter((h) => h.open && h.close).map((h) => ({ '@type': 'OpeningHoursSpecification', dayOfWeek: 'https://schema.org/' + h.day, opens: h.open, closes: h.close })),
      makesOffer: SITE.services.map((s) => ({ '@type': 'Offer', itemOffered: { '@type': 'Service', name: s.name } }))
    };
    const s = document.createElement('script');
    s.type = 'application/ld+json';
    s.textContent = JSON.stringify(data);
    document.head.appendChild(s);
  }

  function boot() {
    try { schema(); } catch (e) { console.error('schema', e); }
    document.querySelectorAll('[data-module]').forEach((el) => {
      const fn = MODULES[el.dataset.module];
      if (!fn) return;
      try { fn(el); } catch (e) { console.error('module ' + el.dataset.module, e); }
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
