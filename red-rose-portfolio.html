*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b0b0d;--card:#141417;--line:#26262c;--txt:#f2f2f4;--mut:#a7a7b0;--red:#d6202f}
body{background:var(--bg);color:var(--txt);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:26px 30px 60px}
nav{display:flex;align-items:center;gap:30px;padding:18px 0;border-bottom:1px solid var(--line);margin-bottom:40px}
.logo{font-family:'Archivo';font-weight:800;font-size:22px;letter-spacing:.04em;text-decoration:none;color:var(--txt)}
.logo span{color:var(--red)}
nav .links{display:flex;gap:26px;margin-left:auto;font-size:14px}
nav .links a{color:var(--mut);text-decoration:none}
.btn{display:inline-block;background:var(--red);color:#fff;font-weight:700;padding:15px 30px;border-radius:8px;text-decoration:none;font-size:15px}
header h1{font-family:'Archivo';font-weight:800;font-size:clamp(36px,5vw,60px);text-transform:uppercase;margin:10px 0 12px}
header h1 em{font-style:normal;color:var(--red)}
header p{color:var(--mut);font-size:16px;line-height:1.7;max-width:640px;margin-bottom:36px}
.eyebrow{font-size:11px;letter-spacing:.3em;color:var(--red);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.shot{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.shot img{width:100%;height:300px;object-fit:cover;display:block}
.shot figcaption{padding:18px 20px}
.shot figcaption b{display:block;font-size:15px;margin-bottom:4px}
.shot figcaption span{color:var(--mut);font-size:13px}
.band{margin-top:50px;border:1px solid var(--line);border-radius:20px;padding:44px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;background:linear-gradient(120deg,#20090c,#0d080a)}
.band h3{font-family:'Archivo';font-size:clamp(24px,3.2vw,38px);font-weight:800;text-transform:uppercase}
.band h3 em{font-style:normal;color:var(--red)}
.band .row{display:flex;gap:12px;flex-wrap:wrap}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}nav .links{display:none}.wrap{padding:18px}}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
